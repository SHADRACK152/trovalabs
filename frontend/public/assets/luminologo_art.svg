<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Lumino AI">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100%" height="100%" rx="32" fill="url(#g)"/>
  <g transform="translate(100,100)" filter="url(#glow)">
    <circle r="44" fill="#fff" opacity="0.06"/>
    <g transform="rotate(-20)">
      <path d="M-36 0 C -20 -28, 20 -28, 36 0 C 20 28, -20 28, -36 0 Z" fill="#fff" opacity="0.12"/>
      <circle cx="0" cy="-10" r="22" fill="url(#g)"/>
    </g>
    <g transform="translate(-6,6)">
      <path d="M0,-28 L6,-12 L22,-8 L10,0 L14,16 L0,8 L-14,16 L-10,0 L-22,-8 L-6,-12 Z" fill="#fff" opacity="0.9"/>
    </g>
  </g>
  <text x="50%" y="92%" font-family="Inter, Roboto, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" opacity="0.9">Lumino</text>
</svg>